name: Build Steam Audio libs (apothecary)

# Standalone openframeworks/apothecary only — no openFrameworks checkout.
# Produces steamaudio-VER-<package_id>.tar.gz for release tag libs-v*

on:
  workflow_dispatch:
    inputs:
      steamaudio_ver:
        description: Steam Audio version stamp
        default: "4.8.1"
      apothecary_ref:
        description: openframeworks/apothecary git ref
        default: "bleeding"
      upload_release:
        description: Upload artifacts to GitHub release tag
        type: boolean
        default: false
      libs_tag:
        description: Release tag (if upload)
        default: "libs-v4.8.1"
  push:
    tags:
      - "libs-v*"
    paths:
      - "scripts/apothecary/**"
      - "scripts/build_libs.sh"
      - "scripts/platforms.sh"
      - ".github/workflows/build-libs.yml"

env:
  STEAMAUDIO_VER: ${{ github.event.inputs.steamaudio_ver || '4.8.1' }}
  APOTHECARY_REF: ${{ github.event.inputs.apothecary_ref || 'bleeding' }}

jobs:
  build:
    name: ${{ matrix.package_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_id: osx
            os: macos-14
            apo_type: osx
          - package_id: linux64
            os: ubuntu-22.04
            apo_type: linux
          - package_id: vs-x64
            os: windows-2022
            apo_type: vs
          # Uncomment when formula/deps are ready on CI:
          # - package_id: emscripten-wasm
          #   os: ubuntu-22.04
          #   apo_type: emscripten
          # - package_id: android-arm64
          #   os: ubuntu-22.04
          #   apo_type: android

    steps:
      - name: Checkout ofxSteamAudio
        uses: actions/checkout@v4

      - name: Checkout openframeworks/apothecary only
        uses: actions/checkout@v4
        with:
          repository: openframeworks/apothecary
          ref: ${{ env.APOTHECARY_REF }}
          path: apothecary

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config automake autoconf libtool || true

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            autoconf automake libtool git curl

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Apothecary platform install script
        shell: bash
        run: |
          set -e
          APO="${GITHUB_WORKSPACE}/apothecary"
          case "${{ matrix.apo_type }}" in
            osx)
              if [ -f "$APO/scripts/osx/install.sh" ]; then bash "$APO/scripts/osx/install.sh" || true; fi
              ;;
            linux)
              if [ -f "$APO/scripts/linux/install.sh" ]; then bash "$APO/scripts/linux/install.sh" || true; fi
              if [ -f "$APO/scripts/linux64/install.sh" ]; then bash "$APO/scripts/linux64/install.sh" || true; fi
              ;;
            vs)
              if [ -f "$APO/scripts/vs/install.sh" ]; then bash "$APO/scripts/vs/install.sh" || true; fi
              ;;
            emscripten)
              if [ -f "$APO/scripts/emscripten/install.sh" ]; then bash "$APO/scripts/emscripten/install.sh" || true; fi
              ;;
            android)
              if [ -f "$APO/scripts/android/install.sh" ]; then bash "$APO/scripts/android/install.sh" || true; fi
              ;;
          esac

      - name: Build steamaudio via apothecary
        shell: bash
        env:
          APOTHECARY_DIR: ${{ github.workspace }}/apothecary
          STEAMAUDIO_VER: ${{ env.STEAMAUDIO_VER }}
          A_VERBOSE: "1"
        run: |
          set -e
          chmod +x scripts/*.sh
          ./scripts/build_libs.sh "${{ matrix.package_id }}"
          ./scripts/package_libs.sh "${{ matrix.package_id }}"
          ls -la scripts/dist/
          # sanity
          test -f "scripts/dist/steamaudio-${STEAMAUDIO_VER}-${{ matrix.package_id }}.tar.gz"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamaudio-${{ matrix.package_id }}
          path: scripts/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/libs-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.upload_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect tar.gz
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.libs_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Steam Audio libs ${TAG}" \
              --notes "Prebuilt Steam Audio libraries for ofxSteamAudio (apothecary-only CI).

          Install:
          \`\`\`bash
          ./scripts/download_libs.sh host
          \`\`\`
          Built with openframeworks/apothecary (no full openFrameworks checkout).
          "
          fi
          gh release upload "$TAG" dist/*.tar.gz --clobber
